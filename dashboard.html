<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard | PJ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="navbar">
        <div class="logo">PJ_DEV</div>
        <ul class="nav-links">
            <li><a href="index.html" class="hover-link">Back to Portfolio</a></li>
        </ul>
    </nav>

    <main class="dashboard-container reveal active">
        <h2>SIP Investment Calculator</h2>
        <div class="calc-card">
            <form id="sip-form">
                <div class="input-group">
                    <label>Monthly Investment (₹)</label>
                    <input type="number" id="monthly-inv" required placeholder="e.g. 5000">
                </div>
                <div class="input-group">
                    <label>Expected Return Rate (%)</label>
                    <input type="number" id="return-rate" required placeholder="e.g. 12">
                </div>
                <div class="input-group">
                    <label>Time Period (Years)</label>
                    <input type="number" id="years" required placeholder="e.g. 10">
                </div>
                <button type="submit" class="calc-btn hover-link">Calculate Future Value</button>
            </form>
            
            <div id="result-box" class="result-box hidden">
                <h3>Estimated Returns</h3>
                <p>Total Invested: <span id="total-invested">₹0</span></p>
                <p>Wealth Gained: <span id="wealth-gained">₹0</span></p>
                <h4 class="total-val">Total Value: <span id="total-value">₹0</span></h4>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
